[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseractinator"
version = "0.1.0"
description = "Unified notebook-first tools for projecting and slicing a rotating 4D tesseract."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael Bagalman" }]
dependencies = [
  "matplotlib>=3.4",
  "numpy>=1.21",
  "scipy>=1.7",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.0",
  "ipywidgets>=7.6",
  "notebook>=7.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tesseractinator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",  # line length is enforced by formatter, not lint
]
